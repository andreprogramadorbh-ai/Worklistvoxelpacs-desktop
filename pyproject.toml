[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxel-router-desktop"
version = "0.1.0"
description = "VOXEL Router Desktop — DICOM Gateway & Modality Worklist"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "VOXEL PACS" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydicom>=3.0,<4.0",
  "pynetdicom>=3.0,<4.0",
  "cryptography>=43.0,<45.0",
  "argon2-cffi>=23.1,<24.0",
  "platformdirs>=4.3,<5.0",
  "pydantic>=2.8,<3.0",
  "PySide6>=6.7,<7.0; platform_system == 'Windows'",
  "pywin32>=306; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<6.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]
packaging = ["pyinstaller>=6.10,<7.0"]

[project.scripts]
voxel-router = "app.main:main"
voxel-router-service = "app.service_main:main"
voxel-router-windows-service = "app.windows_service:main"

[tool.setuptools]
packages = [
  "app", "app.api", "app.audit", "app.config", "app.core", "app.database",
  "app.dicom", "app.dicom.echo", "app.dicom.mwl", "app.dicom.scp", "app.dicom.scu",
  "app.queue", "app.router", "app.security", "app.services", "app.validation",
  "desktop", "desktop.components", "desktop.dialogs", "desktop.resources", "desktop.views"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
