name: Build Windows installer package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "installer/**"
      - "tools/**"
      - "pyproject.toml"
      - ".github/workflows/windows-package.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64

      - name: Build package
        shell: pwsh
        run: ./installer/build.ps1 -PythonCommand python

      - name: Verify visual desktop executable
        shell: pwsh
        run: |
          $desktopExecutable = "dist/windows/VOXELRouterDesktop/VOXELRouterDesktop.exe"
          if (-not (Test-Path $desktopExecutable)) {
            throw "O executável visual VOXELRouterDesktop.exe não foi gerado."
          }
          Get-Item $desktopExecutable | Select-Object Name, Length, LastWriteTime

      - name: Install service and validate synthetic DICOM reception
        shell: pwsh
        run: |
          Push-Location dist/windows/VOXELRouterPackage
          $smokeTestSucceeded = $false
          try {
            ./install.ps1
            ./test-reception.ps1
            Start-Sleep -Seconds 5
            $service = Get-Service -Name VOXELRouterService
            if ($service.Status -ne "Running") {
              throw "O serviço encerrou após o teste DICOM. Estado atual: $($service.Status)."
            }
            $health = Invoke-RestMethod -Uri "http://127.0.0.1:17841/health"
            if ($health.status -ne "ok") {
              throw "A API local não respondeu ao health check esperado."
            }
            $smokeTestSucceeded = $true
          }
          finally {
            if ($smokeTestSucceeded -and (Get-Service -Name VOXELRouterService -ErrorAction SilentlyContinue)) {
              ./uninstall.ps1 -RemoveData
            }
            Pop-Location
          }

      - name: Collect service diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "--- Serviço ---"
          Get-Service -Name VOXELRouterService -ErrorAction SilentlyContinue | Format-List *
          & sc.exe queryex VOXELRouterService
          Write-Host "--- Logs do Router ---"
          Get-ChildItem "C:\\ProgramData\\VOXEL\\Router\\logs" -ErrorAction SilentlyContinue
          Get-Content "C:\\ProgramData\\VOXEL\\Router\\logs\\router.log" -Tail 200 -ErrorAction SilentlyContinue
          Write-Host "--- Eventos de aplicação recentes ---"
          try {
            Get-WinEvent -FilterHashtable @{LogName = "Application"; StartTime = (Get-Date).AddMinutes(-10)} |
              Select-Object -First 50 TimeCreated, ProviderName, Id, LevelDisplayName, Message |
              Format-List
          }
          catch {
            Write-Host "Nenhum evento de aplicação encontrado no intervalo de diagnóstico."
          }

      - name: Remove smoke-test service
        if: always()
        shell: pwsh
        run: |
          Push-Location dist/windows/VOXELRouterPackage
          try {
            if (Get-Service -Name VOXELRouterService -ErrorAction SilentlyContinue) {
              ./uninstall.ps1 -RemoveData
            }
          }
          finally {
            Pop-Location
          }

      - name: Upload distributable package
        uses: actions/upload-artifact@v4
        with:
          name: VOXELRouterPackage-windows-x64
          path: dist/windows/VOXELRouterPackage.zip
          if-no-files-found: error
          retention-days: 14
